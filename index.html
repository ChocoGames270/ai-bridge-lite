<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Bridge Lite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <header>
      <h1>AI Bridge Lite</h1>
      <p>Centro de desarrollo y puente de IA (Modo Preventivo)</p>
    </header>

    <!-- Sección de Aportaciones y Estado -->
    <section class="panel-aportacion">
      <h2>Apoyo al Proyecto</h2>
      <p id="pay-msg">Cargando estado de disponibilidad...</p>

      <div class="controles-pago">
        <input type="number" id="pay-amount" min="0" max="100" value="0" step="1">
        <input type="range" id="pay-slider" min="0" max="100" value="0" step="1">
      </div>

      <div class="chips-container">
        <button class="chip" data-amount="0">$0</button>
        <button class="chip" data-amount="10">$10</button>
        <button class="chip" data-amount="25">$25</button>
        <button class="chip" data-amount="50">$50</button>
      </div>

      <div class="accion-descarga" id="descarga">
        <a id="btn-apk" href="#" class="btn-disabled">
          <span id="btn-apk-label">Aplicación próximamente</span>
        </a>
      </div>
    </section>

    <!-- Sección de Consola de IA (Interfaz de Peticiones) -->
    <section class="panel-chat" style="margin-top: 20px;">
      <h2>Consola de IA</h2>
      <div class="chat-inputs">
        <textarea id="user-prompt" placeholder="Escribe tu intención o consulta técnica aquí..." rows="4" style="width: 100%; padding: 10px; border-radius: 8px; box-sizing: border-box;"></textarea>
        <button id="btn-enviar-ai" class="btn-primary" style="margin-top: 10px; padding: 10px 20px;">Enviar a la IA</button>
      </div>
      
      <div class="chat-response" style="margin-top: 15px; background: #f4f4f4; padding: 12px; border-radius: 8px; min-height: 50px; color: #333;">
        <strong>Respuesta:</strong>
        <p id="ai-output" style="white-space: pre-wrap; margin-top: 5px;">Esperando consulta...</p>
      </div>
    </section>
  </main>

    <!-- Carga de Scripts con versión forzada para evitar caché -->
  <script src="onboarding.js?v=2"></script>
  <script src="web.js?v=2"></script>

</body>
</html>
